<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2B55">
<title>בית מדרש קידושין כט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700;800&family=Varela+Round&display=swap">
<style>
/* Direction: calm light bento for the home screen, minimal card-deck lessons. One amber accent on navy ink.
   Signature: tamrurim drawn as road-sign shapes (circle = question, triangle = attack, square = answer). */
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#EEF1F7; --border:rgba(23,32,64,.10); --border-strong:rgba(23,32,64,.18);
  --text-1:#172040; --text-2:rgba(23,32,64,.70); --text-3:rgba(23,32,64,.50);
  --primary:#1F2B55; --on-primary:#FFFFFF;
  --accent:#B26B00; --accent-soft:#FCF0D6;
  --q:#2847B0; --q-soft:#E5EAFF; --k:#B42A20; --k-soft:#FDE6E3; --a:#1A6C46; --a-soft:#DDF2E7; --t:#5E6582; --t-soft:#ECEEF4;
  --shadow:0 1px 2px rgba(20,28,60,.04),0 8px 24px rgba(20,28,60,.07);
  --head:"Rubik","Heebo",system-ui,sans-serif; --ui:"Heebo","Rubik",system-ui,sans-serif; --gemara:"Varela Round","Heebo",system-ui,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:20px;
  --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2C; --surface-2:#1E2438; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --text-1:#F1F3F8; --text-2:rgba(241,243,248,.72); --text-3:rgba(241,243,248,.50);
  --primary:#F2B23E; --on-primary:#1A1406; --accent:#F2B23E; --accent-soft:#3A2D10;
  --q:#9DB0FF; --q-soft:#232C57; --k:#FF948A; --k-soft:#47211F; --a:#74D6A4; --a-soft:#163A2A; --t:#A9AFC8; --t-soft:#262C42;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2C; --surface-2:#1E2438; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --text-1:#F1F3F8; --text-2:rgba(241,243,248,.72); --text-3:rgba(241,243,248,.50);
  --primary:#F2B23E; --on-primary:#1A1406; --accent:#F2B23E; --accent-soft:#3A2D10;
  --q:#9DB0FF; --q-soft:#232C57; --k:#FF948A; --k-soft:#47211F; --a:#74D6A4; --a-soft:#163A2A; --t:#A9AFC8; --t-soft:#262C42;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{direction:rtl}
body{background:var(--bg);color:var(--text-1);font-family:var(--ui);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);text-wrap:balance;line-height:1.2;margin:0}
b,strong{font-weight:700}
.g{font-family:var(--gemara);font-weight:400}
.r{font-weight:700;color:var(--accent)}
.muted{color:var(--text-2)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
header .in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--head);font-weight:800;font-size:19px;background:none;border:0;padding:8px 0;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:14px;font-weight:800}
.hstat{margin-inline-start:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text-2)}
.hstat b{color:var(--text-1);font-variant-numeric:tabular-nums}
.bar{height:3px;background:transparent}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s var(--ease-out)}

/* tamrur tags: road-sign shapes */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--head);font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px 2px 10px;white-space:nowrap;vertical-align:1px;line-height:1.5}
.tag::before{content:"";width:9px;height:9px;background:currentColor;flex:none}
.t-q{background:var(--q-soft);color:var(--q)} .t-q::before{border-radius:50%}
.t-try{background:var(--t-soft);color:var(--t)} .t-try::before{border-radius:50%;background:transparent;border:2px solid currentColor;width:5px;height:5px}
.t-k{background:var(--k-soft);color:var(--k)} .t-k::before{clip-path:polygon(50% 0,100% 100%,0 100%);width:11px;height:10px}
.t-a{background:var(--a-soft);color:var(--a)} .t-a::before{border-radius:2px}
.t-s{background:var(--accent-soft);color:var(--accent)} .t-s::before{transform:rotate(45deg);width:7px;height:7px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-m);padding:0 16px;font-family:var(--head);font-weight:700;font-size:15px;transition:transform .12s var(--ease),background .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{border-color:var(--text-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text-1)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* home: bento */
.hello{padding-block:24px 4px}
.hello .k{font-size:14px;color:var(--text-2);font-weight:500}
.hello h1{font-size:clamp(28px,6vw,40px);font-weight:800;margin-top:2px}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:14px;color:var(--text-2);font-weight:500}
.tile .val{display:flex;align-items:baseline;gap:6px;font-family:var(--head);font-weight:800;font-size:48px;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.tile .val small{font-size:20px;font-weight:700;opacity:.6}
.tile .sub{font-size:14px;color:var(--text-2)}
.tile.hero{background:var(--accent-soft);border-color:transparent}
.tile.hero .val{color:var(--accent)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.tile.wide .txt{flex:1;min-width:180px}
.tile.wide h3{font-size:20px;font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--a);width:0;border-radius:99px;transition:width .35s var(--ease-out)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sec h2{font-size:20px;font-weight:700}
.sec span{font-size:14px;color:var(--text-2)}
.ulist{display:flex;flex-direction:column;gap:10px}
.urow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s var(--ease),border-color .15s var(--ease)}
.urow:hover{border-color:var(--border-strong)}
.urow:active{transform:scale(.99)}
.urow .nc{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:18px}
.urow.st-done .nc{background:var(--a-soft);color:var(--a)}
.urow.st-prog .nc{background:var(--accent-soft);color:var(--accent)}
.urow .t{min-width:0}
.urow h3{font-size:18px;font-weight:700}
.urow .d{font-size:14px;color:var(--text-2);margin-top:1px}
.urow .m{font-size:13px;color:var(--text-3);margin-top:4px;font-variant-numeric:tabular-nums}
.urow .chev{color:var(--text-3);font-size:20px}
.mini{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:220px}
.mini i{display:block;height:100%;background:var(--a)}
details.scope{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:4px 16px}
details.scope summary{cursor:pointer;font-family:var(--head);font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
details.scope summary::after{content:"+";color:var(--text-3);font-size:20px;line-height:1}
details.scope[open] summary::after{content:"−"}
details.scope div{padding-bottom:14px;display:grid;gap:8px;font-size:15px}
.foot{margin-top:24px;font-size:14px;color:var(--text-2)}

/* unit view */
.uhead{padding-block:20px 4px;display:flex;flex-direction:column;gap:2px}
.uhead .k{color:var(--accent);font-weight:700;font-size:14px}
.uhead h2{font-size:clamp(28px,6vw,36px);font-weight:800}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-m);padding:4px;gap:4px;margin:14px 0 16px}
.seg button{border:0;background:transparent;border-radius:var(--r-s);min-height:40px;padding:0 18px;font-family:var(--head);font-weight:700;color:var(--text-2);transition:background .15s var(--ease),color .15s var(--ease)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text-1);box-shadow:var(--shadow)}
.seg .cnt{font-variant-numeric:tabular-nums;font-weight:500;color:var(--text-3);margin-inline-start:4px}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--surface-2);transition:background .25s var(--ease)}
.steps i.on{background:var(--accent)}
.steps i.past{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.deck{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow)}
.slide{padding:22px 18px 22px}
.slide .cnt{font-size:13px;color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.slide h3{font-size:24px;font-weight:700;margin:2px 0 14px}
.slide p{margin:0 0 12px;max-width:62ch}
@keyframes enter{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.slide.fwd{animation:enter .3s var(--ease-out)}
.slide.back{animation:enterBack .3s var(--ease-out)}
.actionbar{position:fixed;inset:auto 0 0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center}
.actionbar .grow{flex:1}
.actionbar .btn.pri{flex:1;max-width:320px;margin-inline-start:auto}

/* animation primitives: visible at rest, play when .play is added */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.play .a-up{animation:up .35s both var(--ease-out);animation-delay:calc(var(--d,0) * 1s)}
.play .a-pop{animation:pop .3s both var(--ease-out);animation-delay:calc(var(--d,0) * 1s)}
.play .a-shake{animation:up .35s both var(--ease-out),shake .3s .35s both;animation-delay:calc(var(--d,0) * 1s),calc(var(--d,0) * 1s + .35s)}
.strike{position:relative}
.strike::after{content:"";position:absolute;inset:50% -4px auto;height:2px;background:var(--k);transform-origin:right;transform:scaleX(1);border-radius:2px}
.play .strike::after{animation:strike .3s both var(--ease-out);animation-delay:calc(var(--sd,0) * 1s)}
@media (prefers-reduced-motion: reduce){.play *,.slide{animation:none!important;transition:none!important}}

/* lesson visuals */
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r-m);background:var(--surface-2);margin-bottom:8px}
.ok{color:var(--a);font-weight:700;white-space:nowrap;font-size:14px}.no{color:var(--k);font-weight:700;white-space:nowrap;font-size:14px}
.flow{display:flex;flex-direction:column;gap:10px}
.step{border-radius:var(--r-m);padding:10px 14px;background:var(--surface-2);border-inline-start:4px solid var(--border-strong)}
.step.q{border-inline-start-color:var(--q)}.step.t{border-inline-start-color:var(--t)}.step.k{border-inline-start-color:var(--k)}.step.a{border-inline-start-color:var(--a)}.step.s{border-inline-start-color:var(--accent)}
.step .lbl{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:stretch}
@media (max-width:560px){.chain{grid-template-columns:1fr}}
.node{border-radius:var(--r-m);padding:12px 14px;background:var(--surface-2)}
.node b{display:block;font-family:var(--head);font-size:17px;margin-bottom:2px}
.node .src{font-size:13px;color:var(--text-2);margin-top:4px}
.big{font-family:var(--head);font-weight:800;font-size:clamp(40px,10vw,64px);line-height:1}
.flip{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}
.flip .card{background:var(--accent-soft);border-radius:var(--r-l);padding:16px 22px;text-align:center;min-width:150px}
.flip .card .big{font-family:var(--gemara);font-weight:400}
.rays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
@media (max-width:480px){.rays{grid-template-columns:1fr}}
.rays div{background:var(--accent-soft);border-radius:var(--r-m);padding:12px;text-align:center}
.rays b{display:block;font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent)}
.sorter{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:40px;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:0 14px;font-weight:500;transition:background .15s var(--ease)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.verdict{min-height:76px;border-radius:var(--r-m);padding:12px 14px;background:var(--surface-2)}
.list6{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.list6 div{background:var(--surface-2);border-radius:var(--r-m);padding:10px;text-align:center;font-weight:700}
.list6 div span{display:block;font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent);line-height:1.2}
.note{border-radius:var(--r-m);padding:10px 14px;background:var(--accent-soft);font-size:15px}
.warnbox{border-radius:var(--r-m);padding:10px 14px;background:var(--k-soft);font-size:15px}

/* coins */
.stage{position:relative;height:360px;border-radius:var(--r-l);background:var(--surface-2);overflow:hidden;margin-top:10px}
.zone{position:absolute;border:2px dashed var(--border-strong);border-radius:var(--r-m);padding:6px 10px;font-size:14px;font-weight:700;font-family:var(--head);transition:background .25s var(--ease),border-color .25s var(--ease)}
.zone small{display:block;font-weight:400;color:var(--text-2);font-family:var(--ui)}
.zone.sold{border-color:var(--k)}
.zone.hit{border-style:solid;border-color:var(--a);background:var(--a-soft)}
.zone.block{border-style:solid;border-color:var(--k);background:var(--k-soft)}
.coin{position:absolute;top:0;right:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#d9a520 60%,#9c6d00);box-shadow:0 1px 2px rgba(0,0,0,.3);display:grid;place-items:center;font-size:11px;font-weight:700;color:#5a3d00;transition:transform .45s var(--ease-out),opacity .25s}
.kohen{position:absolute;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);transition:transform .45s var(--ease-out),opacity .25s}
.scen{display:flex;gap:8px;flex-wrap:wrap}
.scen button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.scentext{margin-top:10px;min-height:56px}

/* workbook */
.filter{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.filter .chip{min-height:36px;font-size:14px}
.qlist{display:flex;flex-direction:column;gap:10px}
.pagehead{font-family:var(--head);font-weight:700;font-size:15px;color:var(--text-2);margin:18px 0 0;display:flex;gap:8px;align-items:center}
.pagehead::after{content:"";flex:1;height:1px;background:var(--border)}
.q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),opacity .2s}
.q.done{border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.q.done .txt{color:var(--text-2)}
.q .top{display:flex;gap:10px;align-items:flex-start}
.q .num{flex:none;font-family:var(--head);font-weight:700;font-size:13px;background:var(--surface-2);border-radius:999px;padding:2px 10px;margin-top:2px;font-variant-numeric:tabular-nums}
.q.done .num{background:var(--a-soft);color:var(--a)}
.q .txt{flex:1;min-width:0;font-weight:500;font-size:16px}
.q .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.q .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.q .acts .btn[aria-expanded="true"]{background:var(--surface-2)}
.donebtn{margin-inline-start:auto}
.donebtn[aria-pressed="true"]{background:var(--a-soft);color:var(--a);border-color:transparent}
.reveal{margin-top:10px;border-radius:var(--r-m);padding:12px 14px;font-size:15px}
.reveal.hint{background:var(--accent-soft)}
.reveal.ans{background:var(--a-soft)}
.reveal .h{font-family:var(--head);font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.reveal.hint .h{color:var(--accent)}.reveal.ans .h{color:var(--a)}
.reveal p{margin:0 0 6px}
.gtab{overflow-x:auto}
.gtab table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;min-width:420px;background:var(--surface);border-radius:var(--r-s);overflow:hidden}
.gtab td,.gtab th{border-bottom:1px solid var(--border);padding:7px 10px;text-align:start}
.gtab th{font-family:var(--head);font-weight:700}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.empty b{display:block;font-family:var(--head);font-size:20px;color:var(--text-1);margin-bottom:4px}

/* review */
.quiz{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:20px 16px;box-shadow:var(--shadow)}
.quiz .lab{text-align:center;color:var(--text-2);font-size:14px}
.quiz .qq{font-family:var(--gemara);font-size:34px;text-align:center;margin:8px 0 16px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts button{min-height:52px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-m);padding:8px 12px;font-weight:500;transition:background .15s var(--ease)}

  <div class="node a-up" style="--d:.3;border-color:var(--k)"><b>משועבדים</b>נכסים שהיו של האב כשנתחייב, ו<b>מכר אותם</b> אחר כך. הם אצל הקונה, ובעל חוב יכול "לטרוף" אותם, אבל רק אם החוב הוא כמו מלוה בשטר.</div>

u1:[
 [1,"1.1","פסק את המשנה","שים פסיק בין \"סוג המצווה\" לבין הדין, ונקודה בסוף כל משפט. המשנה בנויה מ־6 \"וכל...\".",`<p class="g">כל מצות הבן על האב – אנשים חייבין, ונשים פטורות. וכל מצות האב על הבן – אחד אנשים ואחד נשים חייבין. וכל מצות עשה שהזמן גרמא – אנשים חייבין, ונשים פטורות. וכל מצות עשה שלא הזמן גרמא – אחד אנשים ואחד נשים חייבין. וכל מצות לא תעשה, בין שהזמן גרמא בין שלא הזמן גרמא – אחד אנשים ואחד נשים חייבין, חוץ מבל תקיף, ובל תשחית, ובל תטמא למתים.</p>`],
 [1,"1.2","פסק אותה בשיטת הכאמד\"ט","את ראשי התיבות לא הצלחתי לאמת. הסוף \"מד\"ט\" הוא כנראה מקרה, דין, טעם. בדוק עם חבר מה כל אות מסמנת.",`<p>פירוק לפי <b>מקרה ← דין</b> (הטעם מגיע בגמרא):</p><div class="gtab"><table><tr><th>מקרה</th><th>דין</th></tr><tr><td>מצות הבן על האב</td><td>אנשים חייבין, נשים פטורות</td></tr><tr><td>מצות האב על הבן</td><td>אחד אנשים ואחד נשים חייבין</td></tr><tr><td>עשה שהזמן גרמא</td><td>אנשים חייבין, נשים פטורות</td></tr><tr><td>עשה שלא הזמן גרמא</td><td>שניהם חייבים</td></tr><tr><td>לא תעשה</td><td>שניהם חייבים</td></tr><tr><td>בל תקיף, בל תשחית, בל תטמא</td><td>חוץ מהם: נשים פטורות</td></tr></table></div>`],
 [1,"1.3","שאל על המשנה שאלות תמר\"ב","את ראשי התיבות לא הצלחתי לאמת. ההשערה שלי: ב = ביאור (מאי?), מ = מקור (מנלן?), ר = רבותא/חידוש.",`<p><b>ביאור:</b> "מאי כל מצות הבן על האב?" (זו בדיוק השאלה של הגמרא)</p><p><b>מקור:</b> "מנלן שנשים פטורות ממצוות עשה שהזמן גרמא?" / "מנלן שהאב חייב למול את בנו?"</p><p><b>טעם:</b> "למה דווקא ב־3 הלאווים האלה נשים פטורות?"</p><p><b>חידוש:</b> "מה החידוש ב'בין שהזמן גרמא בין שלא הזמן גרמא'?" גם לאו שיש לו זמן מחייב נשים.</p>`],
 [1,"2","הסבר את המקרים והדינים לפי המשנה (לפני הגמרא). צטט את רש\"י והסבר","קרא את המשנה פשוטה: \"מצות הבן\" = מה שהבן עושה. אחר כך מצא ברש\"י על המשנה (כט. שורה 12) מה הוא כותב על \"כל מצות הבן על האב\".",`<p><b>מקרה א:</b> מצוות שהבן חייב לעשות לאביו (כבוד, מורא). <b>דין:</b> בנים חייבים, בנות פטורות.</p><p><b>מקרה ב:</b> מצוות שהאב חייב לעשות לבנו. <b>דין:</b> גם אבות וגם אמהות חייבים.</p><p><b>רש"י:</b> העתק מהדף את לשון רש"י על המשנה. רש"י מפנה לגמרא, שמפרשת את המשנה אחרת (מצוות האב <u>לבנו</u>, והאם פטורה). <span class="muted">לא ציטטתי את רש"י מילה במילה, צטט מהדף.</span></p>`],
 [1,"3א","הסבר מה זה מצוות עשה שהזמן גרמא, וכתוב דוגמאות","\"הזמן גורם\" למצווה. בלי הזמן אין מצווה.",`<p>מצוות עשה שיש לה <b>זמן קבוע</b>. הזמן הוא שגורם לחיוב, ומחוץ לזמן הזה אין מצווה. דוגמאות: <b>סוכה, לולב, שופר, ציצית</b> (ביום בלבד), <b>תפילין</b>.</p>`],
 [1,"3ב","מה הדין שנכתב במשנה לגבי מצוות עשה שהזמן גרמא?","שורה 3 במשנה.",`<p><span class="g">"אנשים חייבין, ונשים פטורות".</span></p>`],
 [1,"3ג","כתוב לפחות 3 דוגמאות של מצוות עשה שהזמן גרמא שנשים חייבות בהן","חשוב על פסח, שבת, חנוכה ופורים.",`<p><b>מצה</b> בליל פסח · <b>קידוש היום</b> בשבת · <b>נר חנוכה</b> · <b>מקרא מגילה</b> · <b>ארבע כוסות</b> · שמחת יום טוב · הקהל.</p>`],
 [2,"3ד","כתוב 3 דוגמאות למצוות עשה שלא הזמן גרמא. מה הדין שלהן?","מצוות שאפשר לקיים בכל רגע.",`<p><b>מזוזה, מעקה, השבת אבידה</b> (גם צדקה, כיבוד הורים). <b>דין:</b> <span class="g">אחד אנשים ואחד נשים חייבין.</span></p>`],
 [2,"4א","מה הן מצוות לא תעשה? כתוב דוגמאות","\"אל תעשה\".",`<p>איסורים: מצוות שמקיימים כשנמנעים ממעשה. <b>לא תרצח, לא תגנוב, לא תאכל חזיר.</b></p>`],
 [2,"4ב","מה הדין לגבי מצוות לא תעשה? האם יש הבדל אם הן זמן גרמא? בסס מהכתוב","שורה 5 במשנה.",`<p>גם אנשים וגם נשים חייבים, <b>ואין הבדל</b>, כמו שכתוב: <span class="g">"וכל מצות לא תעשה, בין שהזמן גרמא בין שלא הזמן גרמא – אחד אנשים ואחד נשים חייבין"</span>. לדוגמה: גם "לא תאכל חמץ בפסח" (לאו שהזמן גרמא) מחייב נשים.</p>`],

 [2,"4ד","הסבר: בל תקיף / בל תשחית / בל תטמא למתים (צטט רש\"י)","רש\"י על המשנה מביא פסוק לכל אחד. מצא אותו בדף.",`<p><b>בל תקיף:</b> <span class="g">"לא תקיפו פאת ראשכם"</span> (ויקרא יט כז). אסור להקיף, כלומר לגלח, את פאות הראש (ראה איור בעמ' 2).</p><p><b>בל תשחית:</b> <span class="g">"ולא תשחית את פאת זקנך"</span> (שם). אסור להשחית את הזקן בתער. לאישה אין זקן.</p><p><b>בל תטמא למתים:</b> <span class="g">"אמור אל הכהנים בני אהרן... לנפש לא יטמא"</span> (ויקרא כא א). כהן אסור להיטמא למת. "בני אהרן" ולא בנות אהרן.</p><p class="muted">צטט את לשון רש"י מהדף.</p>`]

u2:[
 [3,"1א","מהי מילת התמרור לשאלה?","המילה הראשונה בגמרא.",`<p><b>מאי</b>. פסק: <span class="g">"מאי כל מצות הבן על האב?"</span></p>`],
 [3,"1ב","מהי מילת התמרור לניסיון תשובה שיידחה?","\"אם תאמר\" בארמית.",`<p><b>אילימא</b>. פסק: <span class="g">"אילימא כל מצות דמיחייב ברא למיעבד לאבא – נשים פטורות."</span></p>`],
 [3,"1ג","מהי מילת התמרור של קושיה/דחייה?","\"והרי שנינו בברייתא\".",`<p><b>והתניא</b>. פסק: <span class="g">"והתניא: איש – אין לי אלא איש, אשה מנין? כשהוא אומר 'איש אמו ואביו תיראו' – הרי כאן שנים?"</span></p>`],
 [3,"1ד","מהי מילת התמרור לתשובת הגמרא?","\"כך אמר\".",`<p><b>הכי קאמר</b> (אמר רב יהודה ה"ק). פסק: <span class="g">"אמר רב יהודה: ה"ק – כל מצות הבן המוטלות על האב לעשות לבנו – אנשים חייבין ונשים פטורות."</span></p>`],
 [3,"2","הסבר את שאלת הגמרא. איזה סוג שאלה זו (תמר\"ב)?","הגמרא לא שואלת \"מניין\", אלא \"מה הכוונה\".",`<p>הגמרא שואלת <b>מה פירוש</b> "מצות הבן על האב": האם אלה מצוות שהבן עושה לאב, או מצוות שהאב עושה לבן. זו <b>שאלת ביאור</b> (פירוש המשנה).</p>`],
 [3,"3","הסבר את רש\"י ד\"ה \"איש אמו ואביו תיראו הרי כאן שנים\". מה הוא אומר ובאיזה הקשר?","שים לב לצורת הפועל \"תיראו\".",`<p>רש"י: "תיראו" היא <b>לשון רבים</b>, כלומר שניים: גם איש וגם אישה חייבים במורא אב ואם.</p><p><b>ההקשר:</b> זו הברייתא שמקשה על "אילימא". אם בת חייבת במצוות שכלפי האב, אי אפשר לפרש את המשנה כך ש"נשים פטורות" מהן.</p>`],
 [3,"4","כיצד הגמרא עונה בכל זאת?","רב יהודה, \"הכי קאמר\".",`<p>רב יהודה: המשנה מדברת על <b>מצוות שמוטלות על האב לעשות לבנו</b> (מילה, פדיון וכו'). בהן אנשים (אבות) חייבים, ונשים (אמהות) פטורות.</p>`],
 [3,"5א","רש\"י ד\"ה המוטלות על האב: מהיכן הוא מביא את הדוגמאות?","\"הנך דמפרש...\"",`<p>מ<b>הברייתא</b>: "כגון <b>הנך דמפרש בברייתא</b>": למולו, לפדותו וכו'.</p>`],
 [3,"5ב","מאיפה לומדים את כל הדוגמאות?","\"יליף ואזיל...\"",`<p><b>מפסוקים</b>: "<b>יליף ואזיל מקראי</b>". הגמרא לומדת כל חיוב מפסוק (מילה: "וימל אברהם", פדיון: "כל בכור בניך תפדה").</p>`],
 [3,"6","\"תנינא להא דת\"ר\": הסבר. מה תפקיד המילים?","\"תנינא\" = שנינו.",`<p>"<b>שנינו</b> (במשנה שלנו) את מה ש<b>שנו חכמים</b> (בברייתא)". <b>התפקיד:</b> להראות שהמשנה, לפי פירוש רב יהודה, היא בדיוק הברייתא שמונה את חיובי האב לבנו. זה <b>חיזוק</b> לפירוש של רב יהודה, ופתיחה לברייתא.</p>`],
 [4,"7","מה הם הדברים המפורשים בברייתא שהאב חייב לעשות לבנו?","5, ועוד אחד של \"יש אומרים\".",`<p>① למולו ② לפדותו ③ ללמדו תורה ④ להשיאו אשה ⑤ ללמדו אומנות. <b>ויש אומרים:</b> ⑥ אף להשיטו במים (ללמד אותו לשחות).</p>`],
 [4,"8","הסבר את דברי ר' יהודה","\"כל שאינו מלמד...\"",`<p><span class="g">"כל שאינו מלמד את בנו אומנות – מלמדו ליסטות"</span>. מי שלא מלמד את בנו מקצוע, כאילו מלמד אותו להיות שודד.</p>`],
 [4,"9א","\"ליסטות ס\"ד\": הקטע הזה הוא...","תמיהה.",`<p><b>קושיה (תמיהה)</b> על ר' יהודה.</p>`],
 [4,"9ב","כיצד אתה יודע? מה התמרור?","שתי אותיות.",`<p><b>ס"ד = סלקא דעתך</b>: "וכי עולה על דעתך?!"</p>`],
 [4,"9ג","הסבר את הקטע","",`<p>וכי אפשר לחשוב שמי שלא מלמד אומנות <b>ממש</b> מלמד את בנו לשדוד? הרי הוא לא מלמד אותו כלום!</p>`],
 [4,"10","כיצד הגמרא עונה? הסבר את ההיגיון (רש\"י ד\"ה כאילו מלמדו ליסטות)","\"אלא\".",`<p><span class="g">"אלא: כאילו מלמדו ליסטות"</span>. <b>רש"י:</b> כיוון שאין לו אומנות ויחסר לו לחם, הוא ילך לפרשת דרכים וילסטם את הבריות. ההיגיון: בלי מקצוע אין פרנסה, ובלי פרנסה יגיע לשוד. זו התוצאה, ולכן זה "כאילו" לימד אותו.</p>`],
 [4,"11","ביאורי מילים","",`<div class="gtab"><table><tr><th>ארמית</th><th>פירוש</th><th>ארמית</th><th>פירוש</th></tr><tr><td>מאי</td><td>מה</td><td>אילימא</td><td>אם תאמר</td></tr><tr><td>דמחייב ברא</td><td>שחייב הבן</td><td>למיעבד לאבא</td><td>לעשות לאב</td></tr><tr><td>והתניא</td><td>והרי שנינו בברייתא</td><td>הנך</td><td>אלו</td></tr><tr><td>יליף ואזיל מקראי</td><td>לומד והולך מפסוקים</td><td>הכי קאמר</td><td>כך אמר</td></tr><tr><td>סלקא דעתך</td><td>עולה על דעתך</td><td></td><td></td></tr></table></div>`]
],
u3:[
 [5,"1א","מה התמרור למילת שאלה?","שאלת מקור.",`<p><b>מנלן</b>. <span class="g">"למולו מנלן?"</span></p>`],
 [5,"1ב","הסבר את השאלה","",`<p>מניין לנו (מאיזה פסוק) שהאב חייב למול את בנו?</p>`],
 [5,"1ג","מה התמרור לפסוק שעונה?","\"שכתוב\".",`<p><b>דכתיב</b>: <span class="g">"וימל אברהם את יצחק בנו".</span></p>`],
 [5,"1ד","\"והיכא דלא מהליה אבוה...\": הקטע מסביר...","מה קורה כשהאב לא מל.",`<p>מה הדין אם האב <b>לא</b> מל: <b>בית הדין</b> חייבים למול. ואם גם הם לא מלו, <b>הבן עצמו</b> חייב.</p>`],
 [5,"1ה","מה מוכיח \"המול לכם כל זכר\"? כיצד?","שים לב למילה \"לכם\".",`<p>שבית הדין חייבים למול כשהאב לא מל. "<b>לכם</b>" נאמר בלשון רבים, לכל ישראל, ובית הדין מייצג את הציבור.</p>`],
 [5,"1ו","מה מוכיח \"וערל זכר...\"? כיצד?","על מי העונש?",`<p>שהבן חייב למול את עצמו. העונש (<b>כרת</b>, "ונכרתה") נאמר על <b>הערל עצמו</b> "אשר לא ימול". מי שנענש, מוטלת עליו החובה.</p>`],
 [5,"1ז","מה המקור של \"וערל זכר...\"? כיצד ידעת?","הסתכל בשוליים, ב\"תורה אור\".",`<p><b>בראשית יז יד</b>. מופיע בשוליים של הדף, ב"תורה אור".</p>`],
 [5,"2","שרה האלמנה: האם חייבת למול את בנה? (רש\"י ד\"ה כאשר צוה אותו)","אותו ו...?",`<p><b>לא.</b> <span class="g">"כאשר צוה אותו אלהים"</span>: <b>אותו ולא אותה</b>. רש"י: אברהם נצטווה ולא שרה, ולכן אם אינה מצווה למול את בנה. מי שחייב: <b>בית הדין</b> ("המול לכם"), וכשהבן יגדל, הוא עצמו ("וערל זכר").</p>`],
 [5,"3א","\"אשכחן מיד לדורות מנלן\": הקטע הוא...","",`<p><b>קושיה (שאלה)</b>.</p>`],
 [5,"3ב","מה התמרור?","",`<p><b>אשכחן... מנלן</b>: "מצאנו... מניין?"</p>`],
 [5,"3ג","הסבר (רש\"י ד\"ה מיחייב איהו)","ציווי לאברהם = \"מיד\". ומה עם הדורות הבאים?",`<p>מצאנו שהציווי היה <b>מיד</b>, לאברהם באותו זמן ("כאשר צוה אותו"). מניין שהוא חל גם <b>לדורות</b>, על כל אב בכל דור? <span class="muted">צטט מהדף את לשון רש"י בדיבור שמופיע בחוברת.</span></p>`],
 [5,"4א","\"תנא דבי ר' ישמעאל...\": הקטע הוא...","",`<p><b>תשובה</b>, מברייתא.</p>`],
 [6,"4ב","מה התמרור?","",`<p><b>תנא דבי ר' ישמעאל</b>: "שנה התנא מבית מדרשו של ר' ישמעאל". ציטוט ברייתא שעונה על הקושיה.</p>`],
 [6,"4ג","הסבר את הקטע","3 דברים.",`<p>בכל מקום שכתוב "<b>צו</b>", יש בו שלושה דברים: ① <b>זירוז</b>: <span class="g">"וצו את יהושע וחזקהו ואמצהו"</span> (דברים ג כח). ② <b>מיד</b> ③ <b>ולדורות</b>: <span class="g">"מן היום אשר צוה ה' והלאה לדורותיכם"</span> (במדבר טו כג). מאחר שבמילה כתוב "<b>צוה</b> אותו", היא חלה מיד ולדורות.</p>`],
 [6,"5","ביאורי מילים","",`<div class="gtab"><table><tr><th>ארמית</th><th>פירוש</th><th>ארמית</th><th>פירוש</th></tr><tr><td>מנלן</td><td>מניין לנו</td><td>דכתיב</td><td>שכתוב</td></tr><tr><td>והיכא דלא מהליה אבוה</td><td>ובמקום שלא מל אותו אביו</td><td>מיחייבי בי דינא למימהליה</td><td>חייבים בית הדין למול אותו</td></tr><tr><td>מיחייב איהו למימהל נפשיה</td><td>חייב הוא למול את עצמו</td><td>הנך</td><td>אלו</td></tr><tr><td>איהו</td><td>הוא</td><td>אשכחן</td><td>מצאנו</td></tr><tr><td>תנא דבי</td><td>שנה (התנא) מבית מדרשו של</td><td></td><td></td></tr></table></div>`],
 [6,"6א","פסק את התוספות","וא\"ת = שאלה, וי\"ל = תשובה.",`<p class="g">וא"ת: למ"ל קרא? תיפוק ליה דמצות עשה שהזמן גרמא הוא, שנימול בשמיני ללידתו, ונשים פטורות! וי"ל: כיון דמיום השמיני והלאה אין לה הפסק – לאו זמן גרמא הוא. וא"ת: אכתי מ"ע שהזמן גרמא הוא, דאין מלין אלא ביום, כדאיתא בפרק הערל! וי"ל: דאתיא כמ"ד דמילה שלא בזמנה נוהגת בין ביום בין בלילה.</p>`],
 [6,"6ב","תמרורים: שאלה / תשובה / שאלה שתידחה / דחייה","",`<p><b>שאלה:</b> וא"ת · <b>תשובה:</b> וי"ל · <b>הקושיה על התשובה:</b> "וא"ת <b>אכתי</b>" (= עדיין) · <b>והתשובה עליה:</b> וי"ל. <span class="muted">אם המורה מגדיר "שאלה שתידחה / דחייה" אחרת, התאם לפי ההגדרה שלו.</span></p>`],
 [6,"6ג","מהי שאלת התוספות וכיצד הוא עונה?","",`<p><b>שאלה:</b> למה הגמרא צריכה את "אותו ולא אותה"? מילה היא בשמיני, כלומר מצוות עשה שהזמן גרמא, ונשים ממילא פטורות. <b>תשובה:</b> מהיום השמיני והלאה אין לה הפסק, ולכן היא לא נחשבת זמן גרמא.</p>`],
 [6,"6ד","מדוע התוספות בכל זאת מתעקש? מה עונה?","יום ולילה.",`<p>כי <b>עדיין</b> יש לה זמן: <b>מלים רק ביום</b> ולא בלילה, וזה זמן גרמא. <b>תשובה:</b> הגמרא הולכת כמ"ד ש<b>מילה שלא בזמנה נוהגת גם בלילה</b>, ולכן אין לה שום זמן, וצריך פסוק כדי לפטור את האם.</p>`]
],
u4:[
 [7,"1א","\"מנלן דכתיב כל בכור בניך תפדה\": הקטע הוא...","",`<p><b>שאלה ותשובה</b> (שאלת מקור ותשובה מפסוק).</p>`],
 [7,"1ב","מה התמרורים?","",`<p><b>מנלן</b> = שאלה · <b>דכתיב</b> = תשובה מפסוק.</p>`],
 [7,"1ג","פסק את הקטע","",`<p class="g">לפדותו מנלן? דכתיב: "כל בכור בניך תפדה".</p>`],
 [7,"1ד","מה המקור של הפסוק?","תורה אור בשוליים.",`<p><b>שמות לד כ</b> (וגם בשמות יג יג: "וכל בכור אדם בבניך תפדה").</p>`],
 [7,"1ה","הסבר בלשונך","",`<p>מניין שהאב חייב לפדות את בנו? מהפסוק "כל בכור <b>בניך</b> תפדה". הציווי מופנה לאב, על בניו.</p>`],
 [7,"2","מה מוכיח הפסוק \"פדה תפדה\"?","כפילות.",`<p>אם האב לא פדה את בנו (<span class="g">והיכא דלא פרקיה אבוה</span>), <b>הבן חייב לפדות את עצמו</b>. הכפילות "פדה תפדה" מרבה חיוב נוסף (במדבר יח טו).</p>`],
 [7,"3","האם פדיון הבן היא מצוות עשה שהזמן גרמא? (רש\"י ד\"ה ואיהי מנלן דלא מפקדא) הסבר את שאלת הגמרא ולמה היא נכונה","האם יש זמן שבו כבר אי אפשר לפדות?",`<p><b>לא.</b> פדיון הבן הוא <b>מצוות עשה שלא הזמן גרמא</b>. אפשר לפדות בכל זמן אחרי 30 יום, ואין זמן שבו המצווה פוקעת.</p><p><b>השאלה:</b> מניין שהאם אינה מצווה לפדות את בנה? <b>למה היא נכונה:</b> לפי המשנה נשים <b>חייבות</b> במצוות עשה שלא הזמן גרמא, ולכן צריך מקור מיוחד כדי לפטור אותה. <span class="muted">צטט את רש"י מהדף.</span></p>`],
 [7,"4א","כיצד אפשר לקרוא \"תפדה\"? 2 אפשרויות, מנוקדות","פעיל וסביל.",`<p class="g" style="font-size:22px">תִּפְדֶּה &nbsp;·&nbsp; תִּפָּדֶה</p><p>תִּפְדֶּה = אתה תפדה (אחרים). תִּפָּדֶה = אתה תיפדה (בעצמך).</p>`],
 [7,"4ב","מה הדבר הראשון שהגמרא למדה?","",`<p><b>כל שמצווה לפדות את עצמו, מצווה לפדות אחרים</b>, ומי שאינו מצווה לפדות את עצמו אינו מצווה לפדות אחרים. האם אינה מצווה לפדות את עצמה, ולכן אינה מצווה לפדות את בנה.</p>`],
 [7,"4ג","מה שואלת הגמרא על הדבר הראשון? (רש\"י ד\"ה ואיהי מנלן דלא מיחייבה)","",`<p><span class="g">"ואיהי מנלן דלא מיחייבא למיפרק נפשה?"</span> הלימוד הראשון מניח שאישה לא מצווה לפדות את עצמה. אבל מניין לנו את זה? הרי זו מצוות עשה שלא הזמן גרמא, ולכאורה גם היא חייבת. <span class="muted">צטט את רש"י מהדף.</span></p>`],
 [7,"4ד","כיצד עונה הגמרא?","הפוך את הכיוון.",`<p>"תפדה / תפדה" בכיוון השני: <b>כל שאחרים מצווים לפדותו, מצווה לפדות את עצמו</b>, ומי שאחרים אינם מצווים לפדותו אינו מצווה לפדות את עצמו.</p>`],
 [8,"4ה","מה הגמרא שואלת על התשובה?","",`<p><span class="g">"ומנין שאין אחרים מצווין לפדותה?"</span> ומניין שאחרים (אביה) לא מצווים לפדות אותה?</p>`],
 [8,"4ו","כיצד עונה?","",`<p><span class="tag t-a">דאמר קרא</span> <span class="g">"כל בכור בניך תפדה"</span>: <b>בניך ולא בנותיך.</b></p>`],
 [8,"5","ביאורי מילים","",`<div class="gtab"><table><tr><th>ארמית</th><th>פירוש</th><th>ארמית</th><th>פירוש</th></tr><tr><td>מנלן</td><td>מניין לנו</td><td>דכתיב</td><td>שכתוב</td></tr><tr><td>והיכא דלא פרקיה אבוה</td><td>ובמקום שלא פדה אותו אביו</td><td>מיחייב איהו למפרקיה</td><td>חייב הוא לפדות (את עצמו)</td></tr><tr><td>ואיהי מנלן דלא מיפקדא</td><td>ומניין שהיא אינה מצווה</td><td>למיפרק נפשה</td><td>לפדות את עצמה</td></tr><tr><td>דאמר קרא</td><td>שאמר הפסוק</td><td></td><td></td></tr></table></div>`],
 [8,"6","תוספות ד\"ה \"ואיהי...\": תמרורים, שאלה ותשובה","",`<p class="warnbox">את התוספות הזה לא הצלחתי לקרוא בצילום, ולא אמציא תשובה. <b>שלח לי צילום מקרוב של התוספות</b> ואשלים כאן. בינתיים: התמרור לשאלה הוא בדרך כלל <b>וא"ת / תימה</b>, ולתשובה <b>וי"ל</b>.</p>`]
],
u5:[
 [9,"1","מהי המחלוקת בין חכמים לר' יהודה?","אב ובן שניהם צריכים פדיון.",`<p>כשגם האב וגם הבן צריכים פדיון: <b>תנא קמא:</b> הוא קודם לבנו. <b>ר' יהודה:</b> בנו קודמו, "שזה מצותו על אביו וזה מצות בנו עליו".</p>`],
 [9,"2","יוסף: רק 5 סלעים. את מי לפדות, אותו או את גיא? יש מחלוקת?","ר' ירמיה: הכל מודים...",`<p><b>אין מחלוקת.</b> לפי ר' ירמיה <span class="g">"הכל מודים היכא דליכא אלא חמש סלעים – הוא קודם לבנו"</span>, משום ש<span class="g">"מצוה דגופיה עדיף"</span>. לכן <b>יוסף פודה את עצמו</b>. המחלוקת היא רק כשיש 5 משועבדים ו־5 בני חורין.</p>`],
 [9,"3","הגדר: חמש משועבדים / חמש בני חורין / מלוה בשטר","השדה שכתוב עליה \"נמכר\" באיור.",`<p><b>חמש משועבדים:</b> נכסים בשווי 5 סלעים שהיו של האב כשנתחייב, והוא <b>מכר</b> אותם אחר כך. בעל חוב יכול לטרוף אותם מהקונה, רק אם החוב כמו מלוה בשטר.</p><p><b>חמש בני חורין:</b> נכסים ששווים 5 סלעים, שעדיין של האב ולא נמכרו.</p><p><b>מלוה בשטר:</b> הלוואה שנכתב עליה שטר. יש לה "קול", ולכן היא גובה גם מנכסים משועבדים.</p>`],
 [9,"4","השלם: המחלוקת של __ ו־__ היא היכן שיש __ ומישה סלעים __","",`<p>המחלוקת של <b>חכמים</b> ו־<b>ר' יהודה</b> היא היכן ש<b>יש</b> חמישה סלעים <b>משועבדים</b> וחמישה סלעים <b>בני חורין</b>.</p>`],
 [9,"5","הסבר את שיטת ר' יהודה","",`<p><span class="g">"מלוה דכתיבא באורייתא – ככתובה בשטר דמיא"</span>: החוב לכהן נחשב כמו מלוה בשטר. לכן האב <span class="g">פריק לבריה</span> (פודה את בנו) בחמש בני החורין, <span class="g">ואזיל כהן וטריף</span> (והכהן הולך וגובה) את חמש המשועבדים מהקונים, בשביל פדיון האב. כך <b>מתקיימות שתי המצוות</b>, ולכן הבן קודם.</p>`],
 [9,"6","רש\"י ד\"ה \"ככתובה בשטר דמיא\": על איזו שאלה עונה? כיצד?","איך גובים מקונים בלי שטר?",`<p><b>השאלה:</b> לכהן אין שטר, אז איך הוא יכול לגבות מהנכסים המשועבדים שאצל הקונים? מלוה על פה לא גובה ממשועבדים. <b>התשובה:</b> חוב שכתוב <b>בתורה</b> ידוע לכולם, כמו שטר (יש לו "קול"), ולכן הוא גובה גם ממשועבדים. <span class="muted">צטט את לשון רש"י מהדף.</span></p>`],
 [9,"7","הסבר את שיטת חכמים (רש\"י ד\"ה לאו ככתובה בשטר דמי)","",`<p><span class="g">"מלוה דכתיבא באורייתא – לאו ככתובה בשטר דמיא"</span>: החוב לכהן הוא כמו <b>מלוה על פה</b>, ולכן הכהן <b>לא</b> יכול לטרוף מהקונים. אם האב יפדה את בנו בבני החורין, הוא עצמו יישאר בלי פדיון. <span class="g">והילכך מצוה דגופיה עדיף</span>, והוא קודם. <span class="muted">צטט את רש"י מהדף.</span></p>`],
 [10,"8","ביאורי מילים","",`<div class="gtab"><table><tr><th>ארמית</th><th>פירוש</th><th>ארמית</th><th>פירוש</th></tr><tr><td>תנו רבנן</td><td>שנו חכמים (בברייתא)</td><td>כל היכא דליכא אלא</td><td>בכל מקום שאין אלא</td></tr><tr><td>מאי טעמא</td><td>מה הטעם</td><td>מצוה דגופיה עדיף</td><td>מצווה של גופו עדיפה</td></tr><tr><td>כי פליגי היכא דאיכא</td><td>כשנחלקו, במקום שיש</td><td>דכתיב</td><td>שכתוב</td></tr><tr><td>בהני חמש פריק לבניה</td><td>באלו החמש פודה את בנו</td><td>ואזיל כהן</td><td>והולך הכהן</td></tr><tr><td>וטריף ליה לחמש משועבדים לדידיה</td><td>וטורף (גובה) לעצמו את חמש המשועבדים</td><td>ורבנן סברי</td><td>וחכמים סוברים</td></tr><tr><td>באורייתא</td><td>בתורה</td><td>לאו</td><td>לא</td></tr><tr><td>דמיא</td><td>דומה</td><td>והילכך</td><td>ולכן</td></tr></table></div>`]

}

let cur={u:null,slide:0,tab:"lesson",dir:"fwd",filter:"all"};

}
function unitView(id,tab){
  const u=UNITS.find(x=>x.id===id); if(!u) return home();

  ${u.review?'':`<div class="seg" role="tablist"><button role="tab" id="tab-l" aria-selected="${cur.tab==='lesson'}">שיעור</button><button role="tab" id="tab-b" aria-selected="${cur.tab==='book'}">חוברת<span class="cnt" id="bookcnt">${unitDone(id)}/${BOOK[id].length}</span></button></div>`}

  if(!u.review){
    document.getElementById("tab-l").onclick=()=>go(id);

function lesson(u){
  const pane=document.getElementById("pane");
  const n=u.slides.length, s=Math.min(cur.slide,n-1), sl=u.slides[s];
  pane.innerHTML=`<div class="steps" aria-hidden="true">${u.slides.map((_,i)=>`<i class="${i===s?'on':i<s?'past':''}"></i>`).join('')}</div>

  const el=document.getElementById("slide");
  requestAnimationFrame(()=>el.classList.add("play"));
  if(sl.after==="sorter") sorter();
  if(sl.after==="flip") flip();
  if(sl.after==="coins") coins();
  setBar(`<button class="btn" id="prev" ${s===0?'disabled':''} aria-label="השלב הקודם">→ הקודם</button><button class="btn pri" id="next">${s<n-1?'הבא ←':'לשאלות בחוברת ←'}</button>`);
  document.getElementById("prev").onclick=()=>{cur.slide=s-1;cur.dir="back";lesson(u);window.scrollTo({top:0})};
  document.getElementById("next").onclick=()=>{ if(s<n-1){cur.slide=s+1;cur.dir="fwd";lesson(u);window.scrollTo({top:0})} else go(u.id+"-book") };
  store.set("kid29-slide-"+u.id,s);
}
function book(u){
  const pane=document.getElementById("pane");
  const qs=BOOK[u.id];
  const render=()=>{
    let lastPage=null, html=`<div class="filter" role="group" aria-label="סינון"><button class="chip" data-f="all" aria-pressed="${cur.filter==='all'}">כל השאלות</button><button class="chip" data-f="left" aria-pressed="${cur.filter==='left'}">רק מה שנשאר (${qs.length-unitDone(u.id)})</button></div><div class="qlist">`;
    let shown=0;
    qs.forEach((q,i)=>{
      const d=!!done[key(u.id,q)];
      if(cur.filter==="left"&&d) return; shown++;
      if(q[0]!==lastPage){html+=`<div class="pagehead">עמוד ${q[0]} בחוברת</div>`;lastPage=q[0]}
      html+=`<div class="q ${d?'done':''}"><div class="top"><span class="num">${q[1]}</span><div class="txt">${q[2]}</div></div>
      <div class="acts">${q[3]?`<button class="btn" data-h="${i}" aria-expanded="false" aria-controls="h${i}">רמז</button>`:''}<button class="btn" data-a="${i}" aria-expanded="false" aria-controls="a${i}">תשובה לדוגמה</button>
      <button class="btn donebtn" data-c="${i}" aria-pressed="${d}">${d?'✓ כתבתי':'סמן שכתבתי'}</button></div>
      <div class="reveal hint" id="h${i}" hidden><span class="h">רמז · איפה לחפש</span>${q[3]}</div>
      <div class="reveal ans" id="a${i}" hidden><span class="h">תשובה לדוגמה · נסח במילים שלך</span>${q[4]}</div></div>`;
    });
    if(!shown) html+=`<div class="empty"><b>סיימת את כל השאלות ביחידה</b>אפשר לעבור ליחידה הבאה, או להציג את כל השאלות לחזרה.</div>`;
    html+=`</div>`;
    pane.innerHTML=html;
    pane.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{cur.filter=b.dataset.f;render()});
    const tog=(b,id)=>{const e=document.getElementById(id);e.hidden=!e.hidden;b.setAttribute("aria-expanded",!e.hidden)};
    pane.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>tog(b,"h"+b.dataset.h));
    pane.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>tog(b,"a"+b.dataset.a));
    pane.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      const q=qs[b.dataset.c],k=key(u.id,q),on=!done[k];
      if(on)done[k]=1;else delete done[k];store.set("kid29-done",done);
      b.setAttribute("aria-pressed",on);b.textContent=on?'✓ כתבתי':'סמן שכתבתי';b.closest(".q").classList.toggle("done",on);
      b.closest(".q").querySelector(".num").animate([{transform:"scale(1.25)"},{transform:"none"}],{duration:200,easing:"cubic-bezier(.2,0,0,1)"});
      updateStats();document.getElementById("bookcnt").textContent=`${unitDone(u.id)}/${qs.length}`;
    });
  };
  render();
  const i=UNITS.indexOf(u), nx=UNITS[i+1];
  setBar(`<button class="btn" id="back">→ לשיעור</button>${nx?`<button class="btn pri" id="nextu">ליחידה הבאה ←</button>`:''}`);
  document.getElementById("back").onclick=()=>go(u.id);
  if(nx) document.getElementById("nextu").onclick=()=>go(nx.id);
}

function coins(){
  const st=document.getElementById("stage"), tx=document.getElementById("scentext");

  Array.from({length:10},(_,i)=>`<div class="coin" id="c${i}">ס</div>`).join('');

        k.style.transform=`translate(${-(Z.sold.x+Z.sold.w/2-20)}px,${150}px)`;
        tx.innerHTML=`<b>רבנן:</b> <span class="g">לאו ככתובה בשטר דמיא</span>. הכהן <b>לא</b> יכול לטרוף מהקונה (✗). לכן בני החורין הולכים לפדיון האב, כי <span class="g">מצוה דגופיה עדיף</span>.`}

    },60);
  }
  document.querySelectorAll("#scen button").forEach(b=>b.onclick=()=>setScenario(b.dataset.s));
  setScenario("start");
  window.addEventListener("resize",()=>{const p=document.querySelector('#scen [aria-pressed="true"]');setScenario(p?p.dataset.s:"start")},{once:true});
}

/* ---------- review ---------- */
function review(){
  const pane=document.getElementById("pane");
  pane.innerHTML=`<div class="seg" role="tablist"><button role="tab" id="r1" aria-selected="true">תמרורים</button><button role="tab" id="r2" aria-selected="false">ביאורי מילים</button></div><div id="rq"></div>`;
  const mk=(list,label)=>{
    let score=0,count=0;
    const ask=()=>{
      const i=Math.floor(Math.random()*list.length);const right=list[i][1];
      const opts=[right];while(opts.length<4){const o=list[Math.floor(Math.random()*list.length)][1];if(!opts.includes(o))opts.push(o)}
      opts.sort(()=>Math.random()-.5);
      const box=document.getElementById("rq");
      box.innerHTML=`<div class="quiz play"><div class="lab">${label}</div><div class="qq a-pop">${list[i][0]}</div><div class="opts">${opts.map(o=>`<button data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div><div class="score"><span>${score}/${count} נכונות</span><button class="btn" id="skip">הבא ←</button></div></div>`;
      box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
        if(box.dataset.ans==="1")return;box.dataset.ans="1";count++;
        if(b.dataset.o===right){b.classList.add("right");score++}else{b.classList.add("wrong");box.querySelectorAll("[data-o]").forEach(x=>{if(x.dataset.o===right)x.classList.add("right")})}
        box.querySelector(".score span").textContent=`${score}/${count} נכונות`;
        setTimeout(()=>{box.dataset.ans="";ask()},1100);
      });
      document.getElementById("skip").onclick=()=>{box.dataset.ans="";ask()};
    };
    ask();
  };
  const t1=document.getElementById("r1"),t2=document.getElementById("r2");
  t1.onclick=()=>{t1.setAttribute("aria-selected","true");t2.setAttribute("aria-selected","false");mk(TAMRURIM,"מה התפקיד של התמרור?")};
  t2.onclick=()=>{t2.setAttribute("aria-selected","true");t1.setAttribute("aria-selected","false");mk(GLOSS,"מה הפירוש?")};
  mk(TAMRURIM,"מה התפקיד של התמרור?");
}

/* ---------- routing ---------- */
function go(h){ if(location.hash==="#"+h) route(); else location.hash=h; }
function route(){
  const h=location.hash.replace("#","");
  updateStats();
  if(!h||h==="home"){cur.u=null;home();window.scrollTo({top:0});return}
  const m=h.match(/^(u\d)(-book)?$/);
  if(!m) return home();
  if(cur.u!==m[1]){cur.slide=store.get("kid29-slide-"+m[1],0);cur.dir="fwd";cur.filter="all"}
  unitView(m[1], m[2]?"book":null);
}
document.getElementById("homeBtn").onclick=()=>go("home");
window.addEventListener("hashchange",route);
countdown(); route();
</script>
